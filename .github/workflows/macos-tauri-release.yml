name: Release EditHub desktop
on:
  workflow_dispatch:
  push:
    tags: ['v2.*']
permissions:
  contents: read
concurrency:
  group: edithub-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    strategy:
      matrix:
        platform: [windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: desktop-macos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop-macos/package-lock.json
      - run: rustup default stable
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
  release:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: checks
    strategy:
      # Both builds update the same latest.json asset.
      max-parallel: 1
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: --target universal-apple-darwin
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    outputs:
      id: ${{ steps.bundle.outputs.releaseId }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop-macos/package-lock.json
      - run: rustup default stable
      - if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm ci
        working-directory: desktop-macos
      - name: Verify tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content desktop-macos/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match the app version' }
      - uses: tauri-apps/tauri-action@v1
        id: bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
          APPLE_SIGNING_IDENTITY: '-'
        with:
          projectPath: desktop-macos
          tagName: v__VERSION__
          releaseName: EditHub v__VERSION__
          releaseDraft: true
          args: ${{ matrix.args }}
          prerelease: false
          generateReleaseNotes: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          uploadUpdaterSignatures: true

  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.release.outputs.id }}
        with:
          script: |
            const releaseId = Number(process.env.RELEASE_ID);
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              ...context.repo,
              release_id: releaseId,
            });
            const metadata = assets.find(asset => asset.name === "latest.json");
            if (!metadata) throw new Error("Updater manifest is missing");

            const { data } = await github.rest.repos.getReleaseAsset({
              ...context.repo,
              asset_id: metadata.id,
              headers: { accept: "application/octet-stream" },
            });
            const manifest = data instanceof ArrayBuffer || ArrayBuffer.isView(data)
              ? JSON.parse(Buffer.from(data).toString("utf8"))
              : typeof data === "string" ? JSON.parse(data) : data;

            // Draft manifests use API asset URLs. Public updates need direct
            // download URLs so clients don't share GitHub's anonymous API limit.
            for (const platform of ["windows-x86_64", "darwin-aarch64", "darwin-x86_64"]) {
              if (!manifest.platforms?.[platform]?.signature) {
                throw new Error(`Updater signature is missing for ${platform}`);
              }
            }
            for (const target of Object.values(manifest.platforms)) {
              const asset = assets.find(asset =>
                asset.url === target.url || asset.browser_download_url === target.url);
              if (!asset) throw new Error("Updater package is missing");
              const download = new URL(asset.browser_download_url);
              const tag = encodeURIComponent(`v${manifest.version}`);
              download.pathname = download.pathname.replace(/(\/releases\/download\/)[^/]+\//, `$1${tag}/`);
              target.url = download.href;
            }
            await github.rest.repos.deleteReleaseAsset({
              ...context.repo,
              asset_id: metadata.id,
            });
            await github.rest.repos.uploadReleaseAsset({
              ...context.repo,
              release_id: releaseId,
              name: "latest.json",
              data: JSON.stringify(manifest, null, 2),
              headers: { "content-type": "application/json" },
            });
            await github.rest.repos.updateRelease({
              ...context.repo,
              release_id: releaseId,
              draft: false,
              make_latest: "true",
            });
